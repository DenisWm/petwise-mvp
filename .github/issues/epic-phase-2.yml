name: 📦 Epic
description: Create an epic to track a larger feature or initiative
title: "[Epic]: Phase 2 Tutor Management"
labels: ["epic", "P1-high"]
assignees: []
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Which implementation phase?
      options:
        - "Phase 0: Foundation"
        - "Phase 1: Domain & Core"
        - "Phase 2: Tutor Management"
        - "Phase 3: Pet Management"
        - "Phase 4: Appointment Management"
        - "Phase 5: Queries & Reports"
        - "Phase 6: Polish & Documentation"
      default: 2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Epic Description
      description: High-level description of this epic
      placeholder: |
        What is the overall goal of this epic?
        What business value does it provide?
      value: |
        This epic covers the implementation of the Tutor aggregate, including its domain model, persistence, and REST endpoints for CRUD operations.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and excluded?
      placeholder: |
        **In Scope:**
        - Feature A
        - Feature B
        
        **Out of Scope:**
        - Feature X
        - Feature Y
      value: |
        **In Scope:**
        - Tutor domain model.
        - Gateway interface for tutor persistence.
        - Use case for creating a tutor.
        - JPA entity and repository for tutors.
        - REST endpoints for all CRUD operations on tutors.
  - type: textarea
    id: sub-issues
    attributes:
      label: Sub-Issues
      description: List of issues that belong to this epic
      placeholder: |
        - [ ] #8 Tutor Domain Model
        - [ ] #9 Tutor Gateway Interface
        - [ ] #10 Create Tutor Use Case
        - [ ] #11 Tutor JPA Entity
        - [ ] #12 Create Tutor REST Endpoint
        - [ ] #13 List Tutor Endpoints
        - [ ] #14 Update/Delete Tutor Endpoints
      value: |
        - [ ] #8 Tutor Domain Model
        - [ ] #9 Tutor Gateway Interface
        - [ ] #10 Create Tutor Use Case
        - [ ] #11 Tutor JPA Entity and Repository
        - [ ] #12 Create Tutor REST Endpoint
        - [ ] #13 List and Get Tutor Endpoints
        - [ ] #14 Update and Delete Tutor Endpoints
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Epic Acceptance Criteria
      description: How do we know the epic is complete?
      placeholder: |
        - [ ] All sub-issues completed
        - [ ] Integration tests pass
        - [ ] Documentation updated
        - [ ] Demo successful
      value: |
        - [ ] All sub-issues are completed.
        - [ ] Tutors can be created, read, updated, and deleted through the REST API.
        - [ ] The implementation is fully tested.
    validations:
      required: true

