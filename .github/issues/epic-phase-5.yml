name: 📦 Epic
description: Create an epic to track a larger feature or initiative
title: "[Epic]: Phase 5 Queries & Reports"
labels: ["epic", "P1-high"]
assignees: []
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Which implementation phase?
      options:
        - "Phase 0: Foundation"
        - "Phase 1: Domain & Core"
        - "Phase 2: Tutor Management"
        - "Phase 3: Pet Management"
        - "Phase 4: Appointment Management"
        - "Phase 5: Queries & Reports"
        - "Phase 6: Polish & Documentation"
      default: 5
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Epic Description
      description: High-level description of this epic
      placeholder: |
        What is the overall goal of this epic?
        What business value does it provide?
      value: |
        This epic covers the implementation of query-specific use cases and endpoints, such as viewing a daily agenda and enhancing search capabilities.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and excluded?
      placeholder: |
        **In Scope:**
        - Feature A
        - Feature B
        
        **Out of Scope:**
        - Feature X
        - Feature Y
      value: |
        **In Scope:**
        - A use case and endpoint to view the daily agenda of appointments.
        - Enhancements to search and filter capabilities for various resources.
  - type: textarea
    id: sub-issues
    attributes:
      label: Sub-Issues
      description: List of issues that belong to this epic
      placeholder: |
        - [ ] #25 View Daily Agenda Use Case and Endpoint
        - [ ] #26 Search and Filter Enhancements
      value: |
        - [ ] #25 View Daily Agenda Use Case and Endpoint
        - [ ] #26 Search and Filter Enhancements
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Epic Acceptance Criteria
      description: How do we know the epic is complete?
      placeholder: |
        - [ ] All sub-issues completed
        - [ ] Integration tests pass
        - [ ] Documentation updated
        - [ ] Demo successful
      value: |
        - [ ] All sub-issues are completed.
        - [ ] The daily agenda can be retrieved through the API.
        - [ ] Search and filter capabilities are improved.
    validations:
      required: true

