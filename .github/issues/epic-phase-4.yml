name: 📦 Epic
description: Create an epic to track a larger feature or initiative
title: "[Epic]: Phase 4 Appointment Management"
labels: ["epic", "P1-high"]
assignees: []
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Which implementation phase?
      options:
        - "Phase 0: Foundation"
        - "Phase 1: Domain & Core"
        - "Phase 2: Tutor Management"
        - "Phase 3: Pet Management"
        - "Phase 4: Appointment Management"
        - "Phase 5: Queries & Reports"
        - "Phase 6: Polish & Documentation"
      default: 4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Epic Description
      description: High-level description of this epic
      placeholder: |
        What is the overall goal of this epic?
        What business value does it provide?
      value: |
        This epic covers the implementation of the Appointment aggregate, including its domain model, persistence, and REST endpoints for managing its lifecycle.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and excluded?
      placeholder: |
        **In Scope:**
        - Feature A
        - Feature B
        
        **Out of Scope:**
        - Feature X
        - Feature Y
      value: |
        **In Scope:**
        - Appointment domain model with its lifecycle.
        - Gateway interface for appointment persistence.
        - Use cases for creating an appointment and changing its status.
        - REST endpoints for managing appointments.
  - type: textarea
    id: sub-issues
    attributes:
      label: Sub-Issues
      description: List of issues that belong to this epic
      placeholder: |
        - [ ] #20 Appointment Domain Model
        - [ ] #21 Appointment Gateway Interface
        - [ ] #22 Create Appointment Use Case and Endpoint
        - [ ] #23 Change Appointment Status Use Case and Endpoint
        - [ ] #24 Get and List Appointment Endpoints
      value: |
        - [ ] #20 Appointment Domain Model
        - [ ] #21 Appointment Gateway Interface
        - [ ] #22 Create Appointment Use Case and Endpoint
        - [ ] #23 Change Appointment Status Use Case and Endpoint
        - [ ] #24 Get and List Appointment Endpoints
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Epic Acceptance Criteria
      description: How do we know the epic is complete?
      placeholder: |
        - [ ] All sub-issues completed
        - [ ] Integration tests pass
        - [ ] Documentation updated
        - [ ] Demo successful
      value: |
        - [ ] All sub-issues are completed.
        - [ ] Appointments can be created, their status changed, and they can be retrieved through the REST API.
        - [ ] The implementation is fully tested.
    validations:
      required: true

