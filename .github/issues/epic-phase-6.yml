name: 📦 Epic
description: Create an epic to track a larger feature or initiative
title: "[Epic]: Phase 6 Polish & Documentation"
labels: ["epic", "P1-high"]
assignees: []
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Which implementation phase?
      options:
        - "Phase 0: Foundation"
        - "Phase 1: Domain & Core"
        - "Phase 2: Tutor Management"
        - "Phase 3: Pet Management"
        - "Phase 4: Appointment Management"
        - "Phase 5: Queries & Reports"
        - "Phase 6: Polish & Documentation"
      default: 6
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Epic Description
      description: High-level description of this epic
      placeholder: |
        What is the overall goal of this epic?
        What business value does it provide?
      value: |
        This epic focuses on production-readiness, including error handling, documentation, database migrations, and testing.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and excluded?
      placeholder: |
        **In Scope:**
        - Feature A
        - Feature B
        
        **Out of Scope:**
        - Feature X
        - Feature Y
      value: |
        **In Scope:**
        - Global exception handler.
        - API documentation with Swagger UI.
        - Database migration with Flyway.
        - Health check and actuator endpoints.
        - Complete OpenAPI specification.
        - End-to-end integration tests.
        - Performance testing and optimization.
        - Final documentation review.
  - type: textarea
    id: sub-issues
    attributes:
      label: Sub-Issues
      description: List of issues that belong to this epic
      placeholder: |
        - [ ] #27 Global Exception Handler
        - [ ] #28 API Documentation with Swagger UI
        - [ ] #29 Database Migration with Flyway
        - [ ] #30 Health Check and Actuator Endpoints
        - [ ] #31 Complete OpenAPI Specification
        - [ ] #32 End-to-End Integration Tests
        - [ ] #33 Performance Testing and Optimization
        - [ ] #34 Final Documentation Review
      value: |
        - [ ] #27 Global Exception Handler
        - [ ] #28 API Documentation with Swagger UI
        - [ ] #29 Database Migration with Flyway
        - [ ] #30 Health Check and Actuator Endpoints
        - [ ] #31 Complete OpenAPI Specification
        - [ ] #32 End-to-End Integration Tests
        - [ ] #33 Performance Testing and Optimization
        - [ ] #34 Final Documentation Review
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Epic Acceptance Criteria
      description: How do we know the epic is complete?
      placeholder: |
        - [ ] All sub-issues completed
        - [ ] Integration tests pass
        - [ ] Documentation updated
        - [ ] Demo successful
      value: |
        - [ ] All sub-issues are completed.
        - [ ] The application is production-ready.
        - [ ] The documentation is complete and accurate.
    validations:
      required: true

