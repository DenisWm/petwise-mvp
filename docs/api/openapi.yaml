openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080/api
  description: Generated server url
tags:
- name: Appointments
  description: Appointment management API
- name: Tutors
  description: Tutor management API
- name: Pets
  description: Pet management API
paths:
  /tutors/{id}:
    get:
      tags:
      - Tutors
      summary: Get tutor by ID
      description: Retrieves a tutor by its ID
      operationId: getTutorById
      parameters:
      - name: id
        in: path
        description: Tutor ID
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Tutor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorResponse"
        "200":
          description: Tutor found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorResponse"
    put:
      tags:
      - Tutors
      summary: Update a tutor
      description: Updates an existing tutor
      operationId: updateTutor
      parameters:
      - name: id
        in: path
        description: Tutor ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTutorRequest"
        required: true
      responses:
        "404":
          description: Tutor not found
        "422":
          description: Validation error
        "200":
          description: Tutor updated successfully
          headers:
            Location:
              description: URI of the updated tutor
              style: simple
        "400":
          description: Invalid input
    delete:
      tags:
      - Tutors
      summary: Delete a tutor
      description: Deletes a tutor by its ID
      operationId: deleteTutor
      parameters:
      - name: id
        in: path
        description: Tutor ID
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Tutor not found
        "204":
          description: Tutor deleted successfully
  /pets/{id}:
    get:
      tags:
      - Pets
      summary: Get pet by ID
      description: Retrieves a pet by its ID
      operationId: getPetById
      parameters:
      - name: id
        in: path
        description: Pet ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Pet found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetResponse"
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetResponse"
    put:
      tags:
      - Pets
      summary: Update a pet
      description: Updates an existing pet
      operationId: updatePet
      parameters:
      - name: id
        in: path
        description: Pet ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePetRequest"
        required: true
      responses:
        "404":
          description: Pet not found
        "422":
          description: Validation error
        "200":
          description: Pet updated successfully
          headers:
            Location:
              description: URI of the updated pet
              style: simple
        "400":
          description: Invalid input
    delete:
      tags:
      - Pets
      summary: Delete a pet
      description: Deletes a pet by its ID
      operationId: deletePet
      parameters:
      - name: id
        in: path
        description: Pet ID
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Pet not found
        "204":
          description: Pet deleted successfully
  /tutors:
    get:
      tags:
      - Tutors
      summary: List all tutors
      description: Retrieves a paginated list of tutors with optional search
      operationId: listTutors
      parameters:
      - name: page
        in: query
        description: Page number (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: perPage
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
      - name: search
        in: query
        description: Search terms
        required: false
        schema:
          type: string
          default: ""
        example: John
      - name: sort
        in: query
        description: Sort field
        required: false
        schema:
          type: string
          default: name
        example: name
      - name: direction
        in: query
        description: Sort direction (asc/desc)
        required: false
        schema:
          type: string
          default: asc
        example: asc
      responses:
        "200":
          description: Tutors retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationTutorResponse"
    post:
      tags:
      - Tutors
      summary: Create a new tutor
      description: Creates a new tutor in the system
      operationId: createTutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTutorRequest"
        required: true
      responses:
        "422":
          description: Validation error
        "400":
          description: Invalid input
        "201":
          description: Tutor created successfully
          headers:
            Location:
              description: URI of the created tutor
              style: simple
  /pets:
    get:
      tags:
      - Pets
      summary: List all pets
      description: Retrieves a paginated list of pets with optional search
      operationId: listPets
      parameters:
      - name: page
        in: query
        description: Page number (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: perPage
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
      - name: search
        in: query
        description: Search terms
        required: false
        schema:
          type: string
          default: ""
        example: Fluffy
      - name: sort
        in: query
        description: Sort field
        required: false
        schema:
          type: string
          default: name
        example: name
      - name: direction
        in: query
        description: Sort direction (asc/desc)
        required: false
        schema:
          type: string
          default: asc
        example: asc
      responses:
        "200":
          description: Pets retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationPetResponse"
    post:
      tags:
      - Pets
      summary: Create a new pet
      description: Creates a new pet in the system
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetRequest"
        required: true
      responses:
        "201":
          description: Pet created successfully
          headers:
            Location:
              description: URI of the created pet
              style: simple
        "422":
          description: Validation error
        "400":
          description: Invalid input
  /appointments:
    get:
      tags:
      - Appointments
      summary: List all appointments
      description: Retrieves a paginated list of appointments with optional search
      operationId: listAppointments
      parameters:
      - name: page
        in: query
        description: Page number (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: perPage
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
      - name: search
        in: query
        description: Search terms
        required: false
        schema:
          type: string
          default: ""
        example: DAYCARE
      - name: sort
        in: query
        description: Sort field
        required: false
        schema:
          type: string
          default: startAt
        example: startAt
      - name: direction
        in: query
        description: Sort direction (asc/desc)
        required: false
        schema:
          type: string
          default: asc
        example: asc
      responses:
        "200":
          description: Appointments retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationAppointmentResponse"
    post:
      tags:
      - Appointments
      summary: Create a new appointment
      description: Creates a new appointment for a pet
      operationId: createAppointment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
        required: true
      responses:
        "422":
          description: Validation error
        "201":
          description: Appointment created successfully
          headers:
            Location:
              description: URI of the created appointment
              style: simple
        "400":
          description: Invalid input
  /appointments/{id}/status:
    patch:
      tags:
      - Appointments
      summary: Change appointment status
      description: Changes the lifecycle status of an appointment
      operationId: changeAppointmentStatus
      parameters:
      - name: id
        in: path
        description: Appointment ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAppointmentStatusRequest"
        required: true
      responses:
        "422":
          description: Invalid status transition
        "200":
          description: Status changed successfully
        "404":
          description: Appointment not found
  /appointments/{id}:
    get:
      tags:
      - Appointments
      summary: Get appointment by ID
      description: Retrieves an appointment by its ID
      operationId: getAppointmentById
      parameters:
      - name: id
        in: path
        description: Appointment ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Appointment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "404":
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
    delete:
      tags:
      - Appointments
      summary: Delete an appointment
      description: Deletes an appointment by its ID
      operationId: deleteAppointment
      parameters:
      - name: id
        in: path
        description: Appointment ID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Appointment deleted successfully
        "404":
          description: Appointment not found
  /appointments/agenda:
    get:
      tags:
      - Appointments
      summary: View daily agenda
      description: Retrieves appointments for a specific date with optional status
        and service type filters
      operationId: viewDailyAgenda
      parameters:
      - name: date
        in: query
        description: Date to view (ISO format)
        required: true
        schema:
          type: string
          format: date
        example: 2026-02-26
      - name: status
        in: query
        description: Filter by status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - COMPLETED
          - CANCELED
        example: ACTIVE
      - name: serviceType
        in: query
        description: Filter by service type
        required: false
        schema:
          type: string
          enum:
          - DAYCARE
          - HOTEL
        example: DAYCARE
      - name: page
        in: query
        description: Page number (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: perPage
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
          format: int32
          default: 20
        example: 20
      - name: sort
        in: query
        description: Sort field
        required: false
        schema:
          type: string
          default: startAt
        example: startAt
      - name: direction
        in: query
        description: Sort direction (asc/desc)
        required: false
        schema:
          type: string
          default: asc
        example: asc
      responses:
        "400":
          description: Invalid date parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationAppointmentResponse"
        "200":
          description: Agenda retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationAppointmentResponse"
components:
  schemas:
    UpdateTutorRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    UpdatePetRequest:
      type: object
      properties:
        name:
          type: string
        species:
          type: string
        breed:
          type: string
        birth_date:
          type: string
          format: date
        notes:
          type: string
    CreateTutorRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    CreatePetRequest:
      type: object
      properties:
        tutor_id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
        birth_date:
          type: string
          format: date
        notes:
          type: string
    CreateAppointmentRequest:
      type: object
      properties:
        pet_id:
          type: string
        service_type:
          type: string
          enum:
          - DAYCARE
          - HOTEL
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        notes:
          type: string
    ChangeAppointmentStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - COMPLETED
          - CANCELED
    PaginationTutorResponse:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        perPage:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/TutorResponse"
    TutorResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginationPetResponse:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        perPage:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/PetResponse"
    PetResponse:
      type: object
      properties:
        id:
          type: string
        tutor_id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
        birth_date:
          type: string
          format: date
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppointmentResponse:
      type: object
      properties:
        id:
          type: string
        pet_id:
          type: string
        service_type:
          type: string
          enum:
          - DAYCARE
          - HOTEL
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - COMPLETED
          - CANCELED
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginationAppointmentResponse:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        perPage:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentResponse"
