<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<link rel="stylesheet" href="{{ '/assets/css/just-the-docs-default.css' | relative_url }}">

{% if site.search_enabled %}
<script src="{{ '/assets/js/vendor/lunr.min.js' | relative_url }}"></script>
{% endif %}

{% if site.mermaid %}
<script src="https://cdn.jsdelivr.net/npm/mermaid@{{ site.mermaid.version | default: '9.1.6' }}/dist/mermaid.min.js"></script>
{% endif %}

<script src="{{ '/assets/js/just-the-docs.js' | relative_url }}"></script>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Jekyll SEO tag for meta tags, canonical and structured data -->
{% seo %}

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ site.favicon | default: '/assets/images/favicon.png' | relative_url }}">
<link rel="shortcut icon" type="image/png" href="{{ site.favicon | default: '/assets/images/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ site.favicon | default: '/assets/images/favicon.png' | relative_url }}">
