version: '3.8'

services:
  jekyll:
    image: jekyll/jekyll:latest
    container_name: petwise-docs
    ports:
      - "4000:4000"
      - "35729:35729"  # LiveReload
    volumes:
      - .:/srv/jekyll
      - ./vendor/bundle:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: >
      sh -c "bundle install && 
             jekyll serve --host 0.0.0.0 --livereload --force_polling --incremental"
    networks:
      - jekyll-net

networks:
  jekyll-net:
    driver: bridge

