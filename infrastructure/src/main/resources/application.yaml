spring:
  application:
    name: pet-wise
  web:
    resources:
      add-mappings: false  # Pure REST API – no static content (prevents favicon.ico noise)
  datasource:
    url: jdbc:postgresql://${postgres.url}/petwise
    username: ${postgres.username}
    password: ${postgres.password}
    hikari:
      auto-commit: false
      connection-timeout: 250 # Prevent threads to be hanging.
      max-lifetime: 600000 # Max connection lifetime is 10 minutes.
      maximum-pool-size: 20 # https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
      minimum-idle: 10
      pool-name: master
  jpa:
    open-in-view: false
    show-sql: false  # Disable direct SQL logging (use logging framework instead)
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true  # Format SQL for better readability
        use_sql_comments: true  # Add comments to SQL showing the origin
        highlight_sql: true  # Add ANSI color codes for terminal output
      "[hibernate.generate_statistics]": false
      "[hibernate.connection.provider_disables_autocommit]": true
      # Increase performance, disable auto-commit and open-in-view.
      # https://vladmihalcea.com/why-you-should-always-use-hibernate-connection-provider_disables_autocommit-for-resource-local-jpa-transactions/
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0


server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true # Whether response compression is enabled.
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json # Comma-separated list of MIME types that should be compressed.
    min-response-size: 1024 # Minimum "Content-Length" value that is required for compression to be performed.
  undertow:
    threads:
      worker: 64 # Generally this should be reasonably high, at least 10 per CPU core: https://undertow.io/undertow-docs/undertow-docs-2.1.0/index.html#listeners-2
      io: 4 # One IO thread per CPU core is a reasonable default: https://undertow.io/undertow-docs/undertow-docs-2.1.0/index.html#listeners-2


# ---------------------------------------------------------------------------
# Actuator – runtime observability & management
# ---------------------------------------------------------------------------
# Expose on a separate internal port so it is never reachable from the public
# API gateway / load-balancer.  Only health, info, and loggers are enabled;
# everything else stays off to minimise the attack surface.
management:
  server:
    port: 9090                         # separate port – keep out of public traffic
  endpoints:
    web:
      base-path: /management           # /management/health, /management/loggers, …
      exposure:
        include: health,info,loggers   # only what we need
  endpoint:
    health:
      show-details: when-authorized    # hide internals from anonymous callers
    loggers:
      enabled: true                    # allows GET (read) and POST (change) at runtime


