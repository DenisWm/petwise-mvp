spring:
  # Disable security entirely in tests — no Keycloak instance required
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    username: root
    password: 123456
    url: jdbc:h2:mem:petwise;MODE=PostgreSQL;DATABASE_TO_LOWER=false

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        show_sql: false
    show-sql: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2

# Disable separate management port in tests – serve actuator on the same
# random port that @SpringBootTest picks.
management:
  server:
    port:                              # null = same port as the main server

# Dummy value — no Keycloak in tests, but @Value("${keycloak.issuer-uri}") must resolve
keycloak:
  issuer-uri: http://localhost:9080/realms/petwise





